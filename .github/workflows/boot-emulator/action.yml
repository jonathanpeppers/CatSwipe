name: Test Cuttlefish Docker Image

description: Boots Android emulator using Google Cuttlefish Docker containers

runs:
  using: composite
  steps:
  - name: Pull Cuttlefish Docker Image
    shell: bash
    run: |
      # Pull from US region (closest to GitHub Actions runners)
      DOWNLOAD_LOCATION=us
      echo "Pulling Cuttlefish orchestration image..."
      docker pull $DOWNLOAD_LOCATION-docker.pkg.dev/android-cuttlefish-artifacts/cuttlefish-orchestration/cuttlefish-orchestration
      
      # Tag with a simpler name for easier use
      docker tag $DOWNLOAD_LOCATION-docker.pkg.dev/android-cuttlefish-artifacts/cuttlefish-orchestration/cuttlefish-orchestration cuttlefish-orchestration:latest
      
  - name: Inspect Docker Image
    shell: bash
    run: |
      echo "=== Docker Image Information ==="
      docker images cuttlefish-orchestration:latest
      docker inspect cuttlefish-orchestration:latest | jq '.[0].Config.ExposedPorts // {}'
      
  - name: Test Basic Container Launch
    shell: bash
    run: |
      echo "=== Testing basic container startup ==="
      # Try to run with minimal flags first
      docker run --rm cuttlefish-orchestration:latest --help || echo "Help command failed"
      
  - name: Test Container with More Verbose Output
    shell: bash
    run: |
      echo "=== Testing container with verbose logging ==="
      # Run with timeout to prevent hanging
      timeout 60s docker run --rm \
        -e VERBOSE=1 \
        cuttlefish-orchestration:latest \
        || echo "Container exited with code $?"
        
  - name: Test Container with Exposed Ports
    shell: bash
    run: |
      echo "=== Testing container with port exposure ==="
      # Test with exposed ports but don't expect full functionality
      timeout 60s docker run --rm \
        -p 1080:1080 \
        -p 1443:1443 \
        -p 2080:2080 \
        -p 2443:2443 \
        cuttlefish-orchestration:latest \
        || echo "Container with ports exited with code $?"
        
  - name: Test Container File System
    shell: bash
    run: |
      echo "=== Exploring container filesystem ==="
      docker run --rm cuttlefish-orchestration:latest ls -la /
      echo ""
      echo "=== Checking for CVD tools ==="
      docker run --rm cuttlefish-orchestration:latest which cvd || echo "cvd not found in PATH"
      docker run --rm cuttlefish-orchestration:latest find /usr -name "*cvd*" -type f 2>/dev/null | head -10 || echo "CVD search completed"
      
  - name: Test CVD Command
    shell: bash
    run: |
      echo "=== Testing CVD command ==="
      docker run --rm cuttlefish-orchestration:latest cvd help || echo "CVD help failed"
      docker run --rm cuttlefish-orchestration:latest cvd version || echo "CVD version failed"
      
  - name: Test Orchestrator Service
    shell: bash
    run: |
      echo "=== Testing Host Orchestrator ==="
      # Try to start the orchestrator briefly
      timeout 30s docker run --rm \
        -p 2080:2080 \
        cuttlefish-orchestration:latest \
        /bin/bash -c "host_orchestrator --help" \
        || echo "Host orchestrator test completed"
        
  - name: Check Container Logs and Processes
    shell: bash
    run: |
      echo "=== Running container in background for inspection ==="
      # Start container in background
      CONTAINER_ID=$(docker run -d \
        -p 1080:1080 \
        -p 2080:2080 \
        cuttlefish-orchestration:latest \
        sleep 30)
      
      echo "Container ID: $CONTAINER_ID"
      
      # Give it a moment to start
      sleep 5
      
      echo "=== Container processes ==="
      docker exec $CONTAINER_ID ps aux || echo "Process listing failed"
      
      echo "=== Container logs ==="
      docker logs $CONTAINER_ID
      
      echo "=== Cleanup ==="
      docker stop $CONTAINER_ID || echo "Container already stopped"
      
  - name: Test with Privileged Mode (Limited)
    shell: bash
    run: |
      echo "=== Testing with privileged mode (GitHub Actions limitations apply) ==="
      timeout 60s docker run --rm \
        --privileged \
        cuttlefish-orchestration:latest \
        /bin/bash -c "ls -la /dev/ | grep -E '(kvm|tun)' || echo 'No virtualization devices found'" \
        || echo "Privileged test completed"