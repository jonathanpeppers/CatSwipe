name: Boot Android Emulator

description: Boots Android emulator using Google Cuttlefish Docker containers

runs:
  using: composite
  steps:
  - name: Pull Cuttlefish Docker Image
    if: runner.os == 'Linux'
    shell: bash
    run: |
      # Pull from US region (closest to GitHub Actions runners)
      DOWNLOAD_LOCATION=us
      echo "Pulling Cuttlefish orchestration image..."
      docker pull $DOWNLOAD_LOCATION-docker.pkg.dev/android-cuttlefish-artifacts/cuttlefish-orchestration/cuttlefish-orchestration
      
      # Tag with a simpler name for easier use
      docker tag $DOWNLOAD_LOCATION-docker.pkg.dev/android-cuttlefish-artifacts/cuttlefish-orchestration/cuttlefish-orchestration cuttlefish-orchestration:latest
      
  - name: Verify Docker Image
    if: runner.os == 'Linux'
    shell: bash
    run: |
      echo "=== Docker Image Information ==="
      docker images cuttlefish-orchestration:latest
      echo "Cuttlefish Docker image ready for use"